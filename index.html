<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Linea Miner - Natural Island</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="game-body" class="day-mode">
    <div class="app-container">
        <!-- Top Stats & Time Indicator Header -->
        <div class="header">
            <span>💎 Vault: <span id="balance">15.50</span> L</span>
            <span id="time-indicator" style="font-size: 12px; background: rgba(0,0,0,0.3); padding: 3px 6px; border-radius: 4px;">☀️ Day</span>
            <button class="action-btn" id="lang-btn" onclick="toggleLang()">RU / EN</button>
        </div>

        <!-- Main Game Screen -->
        <div class="content" style="padding: 5px; overflow-y: auto;">
            <!-- Natural Island Surface View (Dynamic Day/Night Theme) -->
            <div id="island-card" class="card island-day" style="text-align: center; margin-bottom: 8px; padding: 12px; border-radius: 10px; position: relative; overflow: hidden; transition: background 1s ease;">
                <div style="font-size: 24px; margin-bottom: 2px;" id="island-icon">🌴🌊⛰️</div>
                <h4 style="margin: 0; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6);">Natural Island Surface</h4>
                <div id="environment-desc" style="font-size: 11px; color: #e0e0e0; margin-top: 2px;">Sunlit beaches & gentle ocean breeze</div>
                <div id="countdown-timer" style="font-size: 13px; color: #ffd700; margin-top: 6px; font-weight: bold;">Listing: 77d 23h</div>
            </div>

            <!-- Mine Layout: Left Elevator Shaft + Right 12 Floors -->
            <div style="display: flex; gap: 6px; align-items: flex-start;">
                <!-- Left Elevator Shaft -->
                <div style="flex: 0 0 90px; background: #0b0e14; border: 1px solid #3a86ff; border-radius: 8px; padding: 6px; text-align: center;">
                    <div style="font-size: 11px; font-weight: bold; color: #3a86ff; margin-bottom: 4px;">🛗 ELEVATOR</div>
                    <div id="elevator-anim" style="font-size: 20px; margin: 15px 0;">🛒⬆️</div>
                    <div style="font-size: 10px; color: #aaa;">Lvl <span id="elevator-lvl">1</span></div>
                    <button class="primary-btn" style="font-size: 10px; padding: 4px; margin-top: 6px;" onclick="upgradeElevator()">Up (10L)</button>
                </div>

                <!-- Right 12 Underground Floors (Miners & Laptop Girls) -->
                <div style="flex: 1; max-height: 360px; overflow-y: auto; padding-right: 2px;" id="floors-container">
                    <!-- Dynamically generated 12 floors -->
                </div>
            </div>
        </div>

        <!-- Navigation Bar -->
        <div class="nav-bar">
            <button class="nav-item" onclick="switchView('landing')">🌐 Home</button>
            <button class="nav-item" onclick="switchView('main')">⛏️ Mine</button>
            <button class="nav-item" onclick="switchView('leaderboard')">🏆 Top</button>
            <button class="nav-item" onclick="switchView('rules')">📜 Rules</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
