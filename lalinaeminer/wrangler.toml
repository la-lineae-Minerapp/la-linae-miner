name = "la-lineae-miner"
main = "src/worker.js"
compatibility_date = "2026-10-13"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "la-lineae-miner-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Comma-separated numeric Telegram user IDs allowed to access admin routes.
ADMIN_TELEGRAM_IDS = ""
# Set this to your deployed Mini App origin before production, e.g. https://miner.example.com
APP_ORIGIN = "http://localhost:8787"
